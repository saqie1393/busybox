name: Build Minimal BusyBox for HI6932 ARMv7 Router

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Minimal Static ARMv7 BusyBox
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout BusyBox source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            file

      - name: Clean previous configuration
        run: make distclean

      - name: Configure minimal BusyBox (allnoconfig + only essential applets)
        run: |
          # Sab kuch band se shuru karein
          make allnoconfig

          # Static linking ON
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=' .config || echo 'CONFIG_STATIC=y' >> .config

          # Cross compiler prefix
          sed -i 's|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX="arm-linux-gnueabi-"|' .config
          grep -q '^CONFIG_CROSS_COMPILER_PREFIX=' .config || echo 'CONFIG_CROSS_COMPILER_PREFIX="arm-linux-gnueabi-"' >> .config

          # ARMv7 flags (softfp, vfpv3-d16) - Huawei standard
          sed -i 's|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -mthumb -O2"|' .config
          grep -q '^CONFIG_EXTRA_CFLAGS=' .config || echo 'CONFIG_EXTRA_CFLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -mthumb -O2"' >> .config

          # Standalone shell enable (built-in applets bina PATH ke)
          sed -i 's/^# CONFIG_FEATURE_SH_STANDALONE is not set/CONFIG_FEATURE_SH_STANDALONE=y/' .config
          sed -i 's/^# CONFIG_FEATURE_PREFER_APPLETS is not set/CONFIG_FEATURE_PREFER_APPLETS=y/' .config

          # BusyBox applet aur --list/--install features enable karein
          sed -i 's/^# CONFIG_BUSYBOX is not set/CONFIG_BUSYBOX=y/' .config
          grep -q '^CONFIG_BUSYBOX=' .config || echo 'CONFIG_BUSYBOX=y' >> .config

          sed -i 's/^# CONFIG_FEATURE_SHOW_SCRIPT is not set/CONFIG_FEATURE_SHOW_SCRIPT=y/' .config
          grep -q '^CONFIG_FEATURE_SHOW_SCRIPT=' .config || echo 'CONFIG_FEATURE_SHOW_SCRIPT=y' >> .config

          # --install option ke liye installer feature
          sed -i 's/^# CONFIG_FEATURE_INSTALLER is not set/CONFIG_FEATURE_INSTALLER=y/' .config
          grep -q '^CONFIG_FEATURE_INSTALLER=' .config || echo 'CONFIG_FEATURE_INSTALLER=y' >> .config

          # Zaroori applets enable karein
          for opt in \
            CONFIG_ASH CONFIG_SH_IS_ASH CONFIG_ASH_BASH_COMPAT CONFIG_ASH_INTERNAL_GLOB \
            CONFIG_AWK CONFIG_SED CONFIG_GREP CONFIG_EGREP CONFIG_FGREP \
            CONFIG_CUT CONFIG_TR CONFIG_HEAD CONFIG_TAIL CONFIG_WC CONFIG_SORT CONFIG_UNIQ CONFIG_XARGS \
            CONFIG_IP CONFIG_IPADDR CONFIG_IPLINK CONFIG_IPROUTE CONFIG_IPRULE CONFIG_IPNEIGH \
            CONFIG_IFCONFIG CONFIG_ROUTE CONFIG_PING CONFIG_PING6 CONFIG_WGET CONFIG_NSLOOKUP \
            CONFIG_NETSTAT CONFIG_NC \
            CONFIG_INSMOD CONFIG_RMMOD CONFIG_LSMOD CONFIG_MODPROBE CONFIG_MODINFO \
            CONFIG_PS CONFIG_TOP CONFIG_KILL CONFIG_KILLALL CONFIG_PIDOF CONFIG_PGREP \
            CONFIG_SLEEP CONFIG_TIMEOUT CONFIG_NOHUP CONFIG_SETSID \
            CONFIG_CAT CONFIG_CP CONFIG_MV CONFIG_RM CONFIG_MKDIR CONFIG_CHMOD \
            CONFIG_CHOWN CONFIG_LN CONFIG_TOUCH CONFIG_FIND CONFIG_INSTALL CONFIG_LS \
            CONFIG_TAR CONFIG_GZIP CONFIG_GUNZIP CONFIG_UNZIP \
            CONFIG_SHA256SUM CONFIG_MD5SUM \
            CONFIG_DMESG CONFIG_FREE CONFIG_DF CONFIG_DU CONFIG_MOUNT CONFIG_UMOUNT \
            CONFIG_UNAME CONFIG_DATE CONFIG_PRINTF CONFIG_ECHO \
            CONFIG_TEST CONFIG_TEST1 CONFIG_TEST2 CONFIG_ENV CONFIG_READLINK \
            CONFIG_DIRNAME CONFIG_BASENAME CONFIG_TRUE CONFIG_FALSE CONFIG_YES \
            CONFIG_MKTEMP CONFIG_REALPATH CONFIG_PRINTENV CONFIG_PWD \
            CONFIG_SEQ CONFIG_TEE CONFIG_TAC CONFIG_TRUNCATE \
            CONFIG_SWAPON CONFIG_SWAPOFF CONFIG_SYNC CONFIG_FSYNC \
            CONFIG_MOUNTPOINT CONFIG_FINDFS CONFIG_BLKID \
            CONFIG_SYSCTL CONFIG_VCONFIG CONFIG_BRCTL CONFIG_TUNCTL \
            CONFIG_UDHCPC CONFIG_UDHCPC_DEFAULT_SCRIPT \
            CONFIG_FTPGET CONFIG_FTPPUT \
          ; do
            # Agar line "is not set" hai to y karein
            if grep -q "^# ${opt} is not set" .config; then
              sed -i "s/^# ${opt} is not set/${opt}=y/" .config
            fi
            # Agar line maujood hi nahi to add karein
            if ! grep -q "^${opt}=" .config && ! grep -q "^# ${opt} is not set" .config; then
              echo "${opt}=y" >> .config
            fi
          done

          # oldconfig se dependencies resolve karein
          yes "" | make oldconfig

          # Debug: verify CONFIG_BUSYBOX enabled
          echo "=== CONFIG_BUSYBOX ==="
          grep '^CONFIG_BUSYBOX=' .config || echo "BUSYBOX applet not set!"
          echo "=== CONFIG_STATIC ==="
          grep '^CONFIG_STATIC=' .config || echo "STATIC not set"
          echo "=== Enabled applets (count) ==="
          grep -c '^CONFIG_.*=y$' .config || true

      - name: Compile for ARMv7
        run: |
          make -j2 \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi-

      - name: Verify static binary and CONFIG_BUSYBOX
        run: |
          set -eu
          test -f busybox
          file busybox
          ls -lh busybox

          arm-linux-gnueabi-readelf -l busybox | head -20

          if arm-linux-gnueabi-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Binary has a dynamic interpreter."
            exit 1
          fi
          echo "OK: Static binary confirmed."

          # Quick test: busybox --list kaam karta hai?
          if ./busybox --list >/dev/null 2>&1; then
            echo "OK: CONFIG_BUSYBOX applet works (--list succeeded)."
          else
            echo "WARNING: --list failed. CONFIG_BUSYBOX might be disabled."
          fi

          mkdir -p output
          cp busybox output/busybox-armv7-hi6932-minimal
          chmod 755 output/busybox-armv7-hi6932-minimal
          sha256sum output/busybox-armv7-hi6932-minimal > output/SHA256SUMS.txt

      - name: Upload minimal BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: busybox-armv7-hi6932-minimal
          path: output/
          if-no-files-found: error
          retention-days: 30
