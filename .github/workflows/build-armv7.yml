name: Build BusyBox 1.34.1 for Huawei E5770 (Static Musl)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget xz-utils ca-certificates

      - name: Download Bootlin armv7-eabihf musl toolchain
        run: |
          set -eu
          TOOLCHAIN_URL="https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2025.08-1.tar.xz"
          echo "Downloading: $TOOLCHAIN_URL"
          wget -q "$TOOLCHAIN_URL" -O /tmp/bootlin-toolchain.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -xJf /tmp/bootlin-toolchain.tar.xz -C /opt/musl-cross --strip-components=1
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain is musl (NOT glibc)
        run: |
          set -eu
          echo "=== Toolchain bin directory ==="
          ls /opt/musl-cross/bin/ | head -20

          echo "=== Compiler version ==="
          /opt/musl-cross/bin/arm-linux-gcc --version || true

          echo "=== Target triple ==="
          /opt/musl-cross/bin/arm-linux-gcc -dumpmachine || true

          echo "=== libc.a path (should be musl, not glibc) ==="
          /opt/musl-cross/bin/arm-linux-gcc -print-file-name=libc.a || true

          echo "=== Check if musl-gcc exists ==="
          ls -la /opt/musl-cross/bin/*musl* 2>/dev/null || echo "No musl-specific wrapper found"

      - name: Load Huawei E5770 configuration
        run: |
          set -eu
          test -f configs/e5770_defconfig
          make distclean
          cp configs/e5770_defconfig .config

          # Static ON
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=' .config || echo 'CONFIG_STATIC=y' >> .config

          # Cross prefix: Bootlin ka default prefix arm-linux- hai
          sed -i 's|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX="arm-linux-"|' .config
          grep -q '^CONFIG_CROSS_COMPILER_PREFIX=' .config || \
            echo 'CONFIG_CROSS_COMPILER_PREFIX="arm-linux-"' >> .config

          # Softfp hataayein (hard-float toolchain ke liye)
          sed -i 's/ -mfloat-abi=softfp//g' .config

          yes "" | make oldconfig

      - name: Debug - Show final config
        run: |
          echo "=== CONFIG_STATIC ==="
          grep '^CONFIG_STATIC=' .config || echo "NOT SET"
          echo "=== CONFIG_CROSS_COMPILER_PREFIX ==="
          grep '^CONFIG_CROSS_COMPILER_PREFIX=' .config || echo "NOT SET"
          echo "=== CONFIG_EXTRA_CFLAGS ==="
          grep '^CONFIG_EXTRA_CFLAGS=' .config || echo "NOT SET"

      - name: Compile BusyBox with explicit musl CC
        run: |
          set -eu
          # Force musl compiler path explicitly
          make -j2 \
            ARCH=arm \
            CROSS_COMPILE="/opt/musl-cross/bin/arm-linux-" \
            CC="/opt/musl-cross/bin/arm-linux-gcc" \
            HOSTCC="gcc"

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          /opt/musl-cross/bin/arm-linux-readelf -h busybox | head -20
          /opt/musl-cross/bin/arm-linux-readelf -l busybox | head -30

          if /opt/musl-cross/bin/arm-linux-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter found!"
            exit 1
          fi
          echo "OK: Static binary confirmed (no INTERP)."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          ls -lh output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static > output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
          if-no-files-found: error
          retention-days: 30
