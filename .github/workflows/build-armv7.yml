name: Build BusyBox 1.34.1 for Huawei E5770 (Static Musl)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget xz-utils ca-certificates

      - name: Download Landley ARMv7 musl toolchain
        run: |
          set -eu
          TOOLCHAIN_URL="https://landley.net/bin/toolchains/latest/armv7l-linux-musleabihf-cross.tar.xz"
          echo "Downloading: $TOOLCHAIN_URL"
          wget -q "$TOOLCHAIN_URL" -O /tmp/landley-toolchain.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -xJf /tmp/landley-toolchain.tar.xz -C /opt/musl-cross --strip-components=1
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eu
          echo "=== Bin dir ==="
          ls /opt/musl-cross/bin/ | head -10
          echo "=== Compiler ==="
          /opt/musl-cross/bin/armv7l-linux-musleabihf-gcc --version || true
          echo "=== Target ==="
          /opt/musl-cross/bin/armv7l-linux-musleabihf-gcc -dumpmachine || true
          echo "=== libc.a ==="
          /opt/musl-cross/bin/armv7l-linux-musleabihf-gcc -print-file-name=libc.a || true

      - name: Load Huawei E5770 configuration
        run: |
          set -eu
          test -f configs/e5770_defconfig
          make distclean
          cp configs/e5770_defconfig .config

          # Static ON
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=' .config || echo 'CONFIG_STATIC=y' >> .config

          # Landley toolchain ka prefix
          sed -i 's|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX="armv7l-linux-musleabihf-"|' .config
          grep -q '^CONFIG_CROSS_COMPILER_PREFIX=' .config || \
            echo 'CONFIG_CROSS_COMPILER_PREFIX="armv7l-linux-musleabihf-"' >> .config

          # Softfp hataayein (hard-float toolchain)
          sed -i 's/ -mfloat-abi=softfp//g' .config

          yes "" | make oldconfig

      - name: Debug config
        run: |
          grep '^CONFIG_STATIC=' .config
          grep '^CONFIG_CROSS_COMPILER_PREFIX=' .config
          grep '^CONFIG_EXTRA_CFLAGS=' .config

      - name: Compile BusyBox
        run: |
          make -j2 \
            ARCH=arm \
            CROSS_COMPILE="armv7l-linux-musleabihf-"

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          /opt/musl-cross/bin/armv7l-linux-musleabihf-readelf -l busybox | head -30

          if /opt/musl-cross/bin/armv7l-linux-musleabihf-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter found!"
            exit 1
          fi
          echo "OK: Static binary confirmed."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          ls -lh output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static > output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
          if-no-files-found: error
          retention-days: 30
