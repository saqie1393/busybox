name: Build BusyBox 1.34.1 for Huawei Router (Static/Musl)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            wget \
            xz-utils \
            ca-certificates

      - name: Download musl ARM cross toolchain
        run: |
          set -eu
          # musl-cross-make prebuilt toolchain (arm-linux-musleabi)
          TOOLCHAIN_URL="https://musl.cc/arm-linux-musleabi-cross.tgz"
          wget -q "$TOOLCHAIN_URL" -O /tmp/musl-cross.tgz
          sudo mkdir -p /opt/musl-cross
          sudo tar -xzf /tmp/musl-cross.tgz -C /opt/musl-cross --strip-components=1
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eu
          which arm-linux-musleabi-gcc
          arm-linux-musleabi-gcc --version
          arm-linux-musleabi-gcc -print-sysroot

      - name: Load Huawei E5770 configuration
        run: |
          set -eu
          test -f configs/e5770_defconfig
          make distclean
          cp configs/e5770_defconfig .config

          # Static ON rakhein (musl ke saath yeh theek chalega)
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=' .config || echo 'CONFIG_STATIC=y' >> .config

          # Cross compiler prefix musl ke liye set karein
          sed -i 's|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX="arm-linux-musleabi-"|' .config
          grep -q '^CONFIG_CROSS_COMPILER_PREFIX=' .config || \
            echo 'CONFIG_CROSS_COMPILER_PREFIX="arm-linux-musleabi-"' >> .config

          yes "" | make oldconfig

      - name: Verify configuration
        run: |
          grep -E \
            '^(CONFIG_STATIC|CONFIG_AWK|CONFIG_IP|CONFIG_WGET|CONFIG_NC|CONFIG_NSLOOKUP|CONFIG_MODPROBE|CONFIG_MODINFO|CONFIG_DMESG|CONFIG_TIMEOUT)=' \
            .config || true

          grep '^CONFIG_EXTRA_CFLAGS=' .config || true
          grep '^CONFIG_CROSS_COMPILER_PREFIX=' .config

      - name: Compile BusyBox (static, musl)
        run: |
          make -j2 \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-musleabi-

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          arm-linux-musleabi-readelf -h busybox
          arm-linux-musleabi-readelf -l busybox

          if arm-linux-musleabi-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter was found"
            exit 1
          fi
          echo "OK: Confirmed static binary (no INTERP)."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          ls -lh output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static \
            > output/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
          if-no-files-found: error
          retention-days: 30
