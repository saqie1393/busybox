name: Build BusyBox for Huawei E5770 (Alpine Native Musl)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build inside Alpine container (native musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            set -eu
            apk add --no-cache build-base linux-headers ncurses-dev perl bash

            make distclean
            cp configs/e5770_defconfig .config

            # CONFIG_STATIC=y rakhein (musl ke saath reliable)
            if grep -q "^CONFIG_STATIC=" .config; then
              sed -i "s/^CONFIG_STATIC=.*/CONFIG_STATIC=y/" .config
            else
              echo "CONFIG_STATIC=y" >> .config
            fi

            # Native compile: cross prefix khali
            sed -i "s|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX=\"\"|" .config

            # ARMv7 CFLAGS (softfp rakhein)
            sed -i "s|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS=\"-march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16 -mthumb -O2\"|" .config

            # tc disable (CBQ headers missing)
            sed -i "s/^CONFIG_TC=y/CONFIG_TC=n/" .config

            yes "" | make oldconfig

            echo "=== Compiling ==="
            make -j2
            file busybox
          '

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          readelf -l busybox | head -30

          if readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter found!"
            exit 1
          fi
          echo "OK: Static binary confirmed."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static > output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
