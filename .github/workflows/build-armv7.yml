name: Build BusyBox 1.34.1 for Huawei Router (Static/Musl)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget xz-utils ca-certificates

      - name: Download Bootlin musl ARMv7 toolchain
        run: |
          set -eu
          # Hard-float variant (eabihf) — router ke liye behtar
          TOOLCHAIN_URL="https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2025.08-1.tar.xz"
          echo "Downloading: $TOOLCHAIN_URL"
          wget -q "$TOOLCHAIN_URL" -O /tmp/bootlin-toolchain.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -xJf /tmp/bootlin-toolchain.tar.xz -C /opt/musl-cross --strip-components=1
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eu
          which arm-linux-gcc || ls /opt/musl-cross/bin/
          arm-linux-gcc --version

      - name: Load Huawei E5770 configuration
        run: |
          set -eu
          test -f configs/e5770_defconfig
          make distclean
          cp configs/e5770_defconfig .config

          # Static ON
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=' .config || echo 'CONFIG_STATIC=y' >> .config

          # Cross prefix Bootlin ke liye
          sed -i 's|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX="arm-linux-"|' .config
          grep -q '^CONFIG_CROSS_COMPILER_PREFIX=' .config || \
            echo 'CONFIG_CROSS_COMPILER_PREFIX="arm-linux-"' >> .config

          # Soft-float flag hataayein (hard-float ke liye)
          sed -i 's/ -mfloat-abi=softfp//g' .config

          yes "" | make oldconfig

      - name: Verify configuration
        run: |
          grep -E '^(CONFIG_STATIC|CONFIG_CROSS_COMPILER_PREFIX)=' .config
          grep '^CONFIG_EXTRA_CFLAGS=' .config || true

      - name: Compile BusyBox (static, musl)
        run: |
          make -j2 ARCH=arm CROSS_COMPILE=arm-linux-

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          arm-linux-readelf -h busybox
          arm-linux-readelf -l busybox | head -20

          if arm-linux-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter was found"
            exit 1
          fi
          echo "OK: Confirmed static binary (no INTERP)."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          ls -lh output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static > output/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
          if-no-files-found: error
          retention-days: 30
