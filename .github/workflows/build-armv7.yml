name: Build BusyBox 1.34.1 for Huawei E5770 (Static Musl - Alpine Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file wget xz-utils ca-certificates docker.io

      - name: Debug - show repo contents
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== configs dir ==="
          ls -la configs/ || true
          echo "=== e5770_defconfig exists? ==="
          test -f configs/e5770_defconfig && echo "YES" || echo "NO"

      - name: Build inside Alpine container (native musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            set -eu
            echo "=== Installing build deps ==="
            apk add --no-cache build-base linux-headers ncurses-dev perl bash

            echo "=== Configuring ==="
            make distclean
            cp configs/e5770_defconfig .config

            # Static ON
            sed -i "s/^CONFIG_STATIC=.*/CONFIG_STATIC=y/" .config
            grep -q "^CONFIG_STATIC=" .config || echo "CONFIG_STATIC=y" >> .config

            # Native compile: cross prefix khali
            sed -i "s|^CONFIG_CROSS_COMPILER_PREFIX=.*|CONFIG_CROSS_COMPILER_PREFIX=\"\"|" .config
            grep -q "^CONFIG_CROSS_COMPILER_PREFIX=" .config || echo "CONFIG_CROSS_COMPILER_PREFIX=\"\"" >> .config

            # Softfp hataayein (Alpine hard-float)
            sed -i "s/ -mfloat-abi=softfp//g" .config

            # ARMv7 CFLAGS rakhein (router ke liye)
            # Extra CFLAGS Alpine ke default hard-float ke saath match karein
            sed -i "s|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS=\"-march=armv7-a -mfpu=vfpv3-d16 -mthumb -mthumb-interwork -fno-short-enums\"|" .config

            # tc applet disable (CBQ headers missing)
            sed -i "s/^CONFIG_TC=y/CONFIG_TC=n/" .config
            grep -q "^CONFIG_TC=" .config || echo "CONFIG_TC=n" >> .config
            sed -i "s/^CONFIG_FEATURE_TC_INGRESS=y/CONFIG_FEATURE_TC_INGRESS=n/" .config

            # trylink ko bypass karein: libraries force
            sed -i "s|^CONFIG_EXTRA_LDLIBS=.*|CONFIG_EXTRA_LDLIBS=\"crypt m rt\"|" .config
            grep -q "^CONFIG_EXTRA_LDLIBS=" .config || echo "CONFIG_EXTRA_LDLIBS=\"crypt m rt\"" >> .config

            yes "" | make oldconfig

            echo "=== Config check ==="
            grep "^CONFIG_STATIC=" .config
            grep "^CONFIG_CROSS_COMPILER_PREFIX=" .config
            grep "^CONFIG_EXTRA_CFLAGS=" .config
            grep "^CONFIG_EXTRA_LDLIBS=" .config
            grep "^CONFIG_TC=" .config

            echo "=== Compiling ==="
            make -j2

            echo "=== Build done ==="
            ls -lh busybox
            file busybox
          '

      - name: Verify static binary
        run: |
          set -eu
          test -f busybox
          file busybox
          readelf -h busybox | head -20
          readelf -l busybox | head -30

          if readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter found!"
            exit 1
          fi
          echo "OK: Static binary confirmed (no INTERP)."

          mkdir -p output
          cp busybox output/busybox-e5770-armv7-static
          chmod 755 output/busybox-e5770-armv7-static
          ls -lh output/busybox-e5770-armv7-static
          sha256sum output/busybox-e5770-armv7-static > output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7-static
          path: output/
          if-no-files-found: error
          retention-days: 30
