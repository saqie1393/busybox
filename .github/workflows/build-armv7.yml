
name: Build BusyBox 1.34.1 for Huawei Router

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            file

      - name: Load Huawei E5770 configuration
        run: |
          set -eu
          test -f configs/e5770_defconfig
          make distclean
          cp configs/e5770_defconfig .config
          yes "" | make oldconfig

      - name: Verify configuration
        run: |
          grep -E \
            '^(CONFIG_STATIC|CONFIG_AWK|CONFIG_IP|CONFIG_WGET|CONFIG_NC|CONFIG_NSLOOKUP|CONFIG_MODPROBE|CONFIG_MODINFO|CONFIG_DMESG|CONFIG_TIMEOUT)=' \
            .config || true

          grep '^CONFIG_EXTRA_CFLAGS=' .config
          grep '^CONFIG_CROSS_COMPILER_PREFIX=' .config

      - name: Compile BusyBox
        run: |
          make -j2 \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabi-

      - name: Verify binary
        run: |
          set -eu
          test -f busybox
          file busybox
          arm-linux-gnueabi-readelf -h busybox
          arm-linux-gnueabi-readelf -l busybox

          if arm-linux-gnueabi-readelf -l busybox | grep -q INTERP; then
            echo "ERROR: Expected static binary, but interpreter was found"
            exit 1
          fi

          mkdir -p output
          cp busybox output/busybox-e5770-armv7
          chmod 755 output/busybox-e5770-armv7
          ls -lh output/busybox-e5770-armv7
          sha256sum output/busybox-e5770-armv7 \
            > output/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-e5770-armv7
          path: output/
          if-no-files-found: error
          retention-days: 30
